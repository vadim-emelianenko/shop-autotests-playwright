name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      marks:
        description: "pytest -m expression, empty runs everything (examples: smoke, api, ui and not smoke)"
        required: false
        default: ""
      workers:
        description: "parallel workers"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4 && ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    env:
      # Pull requests get a quick smoke run, main and nightly runs get everything.
      MARKS: ${{ github.event.inputs.marks || (github.event_name == 'pull_request' && 'smoke' || '') }}
      WORKERS: ${{ github.event.inputs.workers || '4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          pytest ${MARKS:+-m "$MARKS"} -n "$WORKERS" 2>&1 | tee pytest.log || status=$?
          echo "### $(tail -n 1 pytest.log)" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Show results in the run and pull request
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/junit.xml
          include_passed: true
          detailed_summary: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

  report:
    needs: test
    if: always() && needs.test.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Check that tests produced results
        run: test -n "$(ls -A allure-results 2>/dev/null)" || { echo "No Allure results, see the test job log"; exit 1; }

      - name: Get previous report for history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Keep trend history
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Allure report
        run: npx --yes allure-commandline generate allure-results -o allure-report --clean

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true
